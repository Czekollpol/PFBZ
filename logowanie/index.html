<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logowanie do Panelu Rodziny</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:linear-gradient(135deg,#0c0a09,#020617);color:white;min-height:100vh;display:flex;justify-content:center;align-items:center;}
.login-box{background:rgba(30,41,59,0.95);padding:40px;border-radius:20px;width:350px;text-align:center;backdrop-filter:blur(12px);}
.login-box h2{margin-bottom:20px;color:#fb923c;}
.login-box input{width:100%;padding:12px;margin:10px 0;border-radius:10px;border:none;background:#0f172a;color:white;}
.login-box button{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;background:#f97316;color:white;font-weight:bold;cursor:pointer;}
</style>
</head>
<body>

<div class="login-box">
<h2>Logowanie</h2>
<input type="text" id="login" placeholder="Login">
<input type="password" id="password" placeholder="Hasło">
<button onclick="login()">Zaloguj</button>
</div>

<script>
// JSONBin
const BIN="69af4de6d0ea881f40021797";
const KEY="$2a$10$aGDySCRUNkETMRRFjUn/i.l5I4OgqFXhyvttGBTZgoXzROoYqFPP.";

let users=[];

async function loadUsers(){
    const res=await fetch(`https://api.jsonbin.io/v3/b/${BIN}/latest`,{
        headers:{ "X-Master-Key":KEY }
    });
    const data=await res.json();
    users=data.record.users||[];
}

async function login(){
    const loginInput=document.getElementById("login").value.trim();
    const passInput=document.getElementById("password").value.trim();
    const user=users.find(u=>u.login===loginInput && u.password===passInput);
    if(user){
        window.location.href="index.html";
    } else {
        alert("Nieprawidłowy login lub hasło!");
    }
}

// Załaduj użytkowników przy starcie
loadUsers();
</script>

</body>
</html>
