<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admina</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:linear-gradient(135deg,#0c0a09,#020617);color:white;min-height:100vh;display:flex;justify-content:center;align-items:center;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;justify-content:center;align-items:center;z-index:9999;}
.modal-box{background:#1e293b;padding:40px;border-radius:20px;width:400px;max-height:90vh;overflow-y:auto;}
.modal-box input{width:100%;padding:10px;margin:8px 0;border-radius:10px;border:none;background:#0f172a;color:white;}
.modal-box button{width:100%;padding:10px;border:none;border-radius:10px;margin-top:5px;cursor:pointer;font-weight:bold;background:#f97316;}
.delete-btn{background:#ef4444 !important;}
</style>
</head>
<body>

<div class="modal active" id="loginModal">
<div class="modal-box">
<h2>Logowanie Admina</h2>
<input type="text" id="login" placeholder="Login">
<input type="password" id="password" placeholder="Hasło">
<button onclick="login()">Zaloguj</button>
</div>
</div>

<div class="modal" id="adminPanel">
<div class="modal-box">
<h2>Panel Administracyjny</h2>
<input id="name" placeholder="Imię i nazwisko">
<input id="uid" placeholder="UID">
<select id="rank">
<option value="10">10 | Chief of Family</option>
<option value="9">9 | Deputy Chief of Family</option>
<option value="8">8 | Asst. Chief of Family</option>
<option value="7">7 | Awakend</option>
<option value="6">6 | Chosen</option>
<option value="5">5 | Seeker</option>
<option value="4">4 | Adept</option>
<option value="3">3 | Member</option>
<option value="2">2 | Cadet</option>
<option value="1">1 | Vacation / Suspended</option>
</select>
<select id="exam">
<option value="BASIC">BASIC</option>
<option value="NEGO">NEGO</option>
<option value="SHOOTER">SHOOTER</option>
</select>
<button onclick="add()">Dodaj pracownika</button>
<hr>
<input id="editUID" placeholder="UID do edycji">
<select id="editRank">
<option value="10">10 | Chief of Family</option>
<option value="9">9 | Deputy Chief of Family</option>
<option value="8">8 | Asst. Chief of Family</option>
<option value="7">7 | Awakend</option>
<option value="6">6 | Chosen</option>
<option value="5">5 | Seeker</option>
<option value="4">4 | Adept</option>
<option value="3">3 | Member</option>
<option value="2">2 | Cadet</option>
<option value="1">1 | Vacation / Suspended</option>
</select>
<button onclick="edit()">Edytuj rangę</button>
<hr>
<input id="deleteUID" placeholder="UID do usunięcia">
<button class="delete-btn" onclick="remove()">Usuń pracownika</button>
</div>
</div>

<script>
const BIN="69af4de6d0ea881f40021797";
const KEY="$2a$10$aGDySCRUNkETMRRFjUn/i.l5I4OgqFXhyvttGBTZgoXzROoYqFPP.";

// Lista loginów i haseł adminów
let admins=[
{login:"admin",password:"rekru123"},
{login:"boss",password:"topsecret"}
];

let employees=[];

function showAdminPanel(){document.getElementById("loginModal").classList.remove("active");document.getElementById("adminPanel").classList.add("active");}

// Logowanie
function login(){
let l=document.getElementById("login").value;
let p=document.getElementById("password").value;
let ok=admins.some(a=>a.login===l && a.password===p);
if(ok){showAdminPanel();} else {alert("Błędny login lub hasło!");}

// Załaduj pracowników
load();
}

// JSONBin load/save
async function load(){
const res=await fetch(`https://api.jsonbin.io/v3/b/${BIN}/latest`,{headers:{ "X-Master-Key":KEY }});
const data=await res.json();
employees=data.record.employees||[];
render();
}

async function save(){
await fetch(`https://api.jsonbin.io/v3/b/${BIN}`,{
method:"PUT",
headers:{"Content-Type":"application/json","X-Master-Key":KEY},
body:JSON.stringify({employees})
});
}

// Render tabeli
function render(){
employees.sort((a,b)=>b.rank-a.rank);
const table=document.createElement("table");
table.innerHTML="";
let tbody=document.createElement("tbody");
employees.forEach(e=>{
let tr=document.createElement("tr");
tr.innerHTML=`
<td>${e.name||"-"}</td>
<td>${e.uid||"-"}</td>
<td><span class="badge rank${e.rank}">[${e.rank}] ${e.rank}</span></td>
<td>${e.exam||"-"}</td>
<td><button onclick="deleteDirect('${e.uid}')">❌</button></td>`;
tbody.appendChild(tr);
});
document.getElementById("adminPanel").appendChild(tbody);
}

// CRUD
async function add(){employees.push({name:name.value,uid:uid.value,rank:parseInt(rank.value),exam:exam.value});await save();render();}
async function edit(){let emp=employees.find(e=>e.uid===editUID.value);if(emp){emp.rank=parseInt(editRank.value);await save();render();}}
async function remove(){employees=employees.filter(e=>e.uid!==deleteUID.value);await save();render();}
async function deleteDirect(uid){employees=employees.filter(e=>e.uid!==uid);await save();render();}
</script>

</body>
</html>
<script src="../js/app.js"></script>

</body>
</html>
